<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, Arial, sans-serif; width: 300px; margin: 0; padding: 14px; color: #222; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    label { display: block; font-size: 13px; margin: 10px 0 4px; font-weight: 600; }
    select { width: 100%; padding: 5px; font-size: 13px; }
    .row { display: flex; align-items: center; gap: 8px; margin: 10px 0; font-size: 13px; }
    .row input { margin: 0; }
    .row label { margin: 0; font-weight: 400; }
    button { width: 100%; padding: 8px; margin-top: 8px; font-size: 13px; border: 0; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    #mark { background: #b02a37; color: #fff; }
    #clear { background: #e9ecef; color: #333; }
    .note { font-size: 11px; color: #666; margin-top: 4px; line-height: 1.4; }
    #stats { font-size: 12px; color: #555; background: #f6f6f6; border-radius: 6px; padding: 6px 8px; margin: 10px 0 2px; }
    #stats:empty { display: none; }
    #status { font-size: 12px; color: #1e7e34; min-height: 16px; margin-top: 6px; }
  </style>
</head>
<body>
  <h1 data-i18n="extName">Goodreads Translation Marker</h1>

  <label for="lang" data-i18n="popupLanguage">Language</label>
  <select id="lang"></select>

  <label for="scope" data-i18n="popupScope">Run on</label>
  <select id="scope">
    <option value="all" data-i18n="scopeAll">All Goodreads pages</option>
    <option value="recs" data-i18n="scopeRecs">Recommendations page only</option>
  </select>

  <div class="row">
    <input type="checkbox" id="hide" />
    <label for="hide" data-i18n="popupHide">Hide books without this language</label>
  </div>

  <div class="row">
    <input type="checkbox" id="swapCovers" />
    <label for="swapCovers" data-i18n="popupSwapCovers">Show the translated edition cover</label>
  </div>

  <div class="row">
    <input type="checkbox" id="swapTitles" />
    <label for="swapTitles" data-i18n="popupSwapTitles">Show the translated title</label>
  </div>

  <div id="stats"></div>

  <button id="mark" data-i18n="popupMark">Mark non-matching as “Not interested”</button>
  <div class="note" data-i18n="popupMarkNote">Recommendations page only.</div>

  <button id="clear" data-i18n="popupClearCache">Clear cache &amp; recheck</button>

  <div id="status"></div>

  <script src="languages.js"></script>
  <script src="popup.js"></script>
</body>
</html>
